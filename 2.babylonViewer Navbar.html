<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Model Viewer</title>

<!-- Babylon Viewer -->
<script src="https://cdn.babylonjs.com/viewer/babylon.viewer.js"></script>

<style>
body {
    font-family: Arial;
    text-align: center;
}

.viewerContainer {
    width: 600px;
    height: 500px;
    margin: auto;
    border: 1px solid #ccc;
}

babylon {
    width: 100%;
    height: 100%;
}
</style>

<script>
function loadModel(modelUrl) {
    if (modelUrl) {
        document
          .getElementById("viewer")
          .setAttribute("model", modelUrl);
    }
}
</script>

</head>

<body>

<h2>My 3D Model Viewer</h2>

<select onchange="loadModel(this.value)">
    <option value="">-- Select Model --</option>
    <option value="./models/Astronaut.glb">Astronaut</option>
    <option value="./models/mango_cake.glb">Mango Cake</option>
    <option value="./models/fruit_cake.glb">Fruit Cake</option>
    <option value="./models/orange_fruit.glb">Orange Fruit</option>
</select>

<br><br>

<div class="viewerContainer">
    <babylon id="viewer"></babylon>
</div>

</body>
</html>
